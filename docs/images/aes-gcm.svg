<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260"><rect width="960" height="260" rx="18" fill="#151d28"/><style>text{font-family:Arial,sans-serif;fill:#eaf2fb}.t{font-size:22px;font-weight:700}.s{font-size:15px;fill:#9eb3c9}.b{fill:#24364b;stroke:#5aabef;stroke-width:2}.a{stroke:#60d394;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60d394"/></marker></defs><text x="40" y="42" class="t">AES-256-GCM — mã hóa có xác thực</text><rect x="45" y="92" width="170" height="80" rx="10" class="b"/><text x="130" y="125" text-anchor="middle">Dữ liệu gốc</text><text x="130" y="150" class="s" text-anchor="middle">+ metadata</text><path d="M215 132H340" class="a"/><rect x="340" y="75" width="250" height="114" rx="10" class="b"/><text x="465" y="112" text-anchor="middle">AES-256-GCM</text><text x="465" y="138" class="s" text-anchor="middle">Khóa 256 bit + nonce 96 bit</text><text x="465" y="163" class="s" text-anchor="middle">Confidentiality + Integrity</text><path d="M590 132H720" class="a"/><rect x="720" y="92" width="195" height="80" rx="10" class="b"/><text x="817" y="123" text-anchor="middle">Bản mã</text><text x="817" y="149" class="s" text-anchor="middle">+ tag 128 bit</text><text x="480" y="232" class="s" text-anchor="middle">Sai mật khẩu hoặc thay đổi 1 bit → kiểm tra tag thất bại → không xuất dữ liệu</text></svg>
