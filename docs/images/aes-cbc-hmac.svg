<svg xmlns="http://www.w3.org/2000/svg" width="960" height="285" viewBox="0 0 960 285"><rect width="960" height="285" rx="18" fill="#151d28"/><style>text{font-family:Arial,sans-serif;fill:#eaf2fb}.t{font-size:22px;font-weight:700}.s{font-size:15px;fill:#9eb3c9}.b{fill:#24364b;stroke:#f0a55b;stroke-width:2}.a{stroke:#60d394;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60d394"/></marker></defs><text x="40" y="42" class="t">AES-256-CBC + HMAC-SHA256 — Encrypt-then-MAC</text><rect x="45" y="92" width="165" height="80" rx="10" class="b"/><text x="127" y="125" text-anchor="middle">Dữ liệu gốc</text><text x="127" y="150" class="s" text-anchor="middle">PKCS#7 padding</text><path d="M210 132H305" class="a"/><rect x="305" y="83" width="195" height="98" rx="10" class="b"/><text x="402" y="119" text-anchor="middle">AES-256-CBC</text><text x="402" y="146" class="s" text-anchor="middle">Khóa mã hóa + IV 128 bit</text><path d="M500 132H590" class="a"/><rect x="590" y="83" width="190" height="98" rx="10" class="b"/><text x="685" y="119" text-anchor="middle">HMAC-SHA256</text><text x="685" y="146" class="s" text-anchor="middle">Khóa MAC riêng</text><path d="M780 132H845" class="a"/><rect x="820" y="72" width="110" height="120" rx="10" class="b"/><text x="875" y="112" text-anchor="middle">Bản mã</text><text x="875" y="137" class="s" text-anchor="middle">+ MAC</text><text x="875" y="162" class="s" text-anchor="middle">256 bit</text><text x="480" y="225" class="s" text-anchor="middle">HMAC bao phủ metadata + toàn bộ bản mã; được kiểm tra trước khi chấp nhận kết quả</text><text x="480" y="252" class="s" text-anchor="middle">PBKDF2 sinh 64 byte: 32 byte khóa AES và 32 byte khóa HMAC độc lập</text></svg>
